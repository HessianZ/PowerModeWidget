name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/PowerModeWidget/PowerModeWidget.csproj -c Release
      - name: Offline tests
        run: dotnet run --project tests/PowerModeWidget.Tests/PowerModeWidget.Tests.csproj -c Release
      - name: Package portable application
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP ('PowerModeWidget-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath 'src/PowerModeWidget/bin/Release/net48/PowerModeWidget.exe', 'src/PowerModeWidget/bin/Release/net48/PowerModeWidget.exe.config', 'README.md', 'LICENSE' -Destination $packageDir
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath artifacts/PowerModeWidget-win-x64.zip -Force
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PowerModeWidget-win-x64
          path: artifacts/PowerModeWidget-win-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG artifacts/PowerModeWidget-win-x64.zip --verify-tag --title "PowerModeWidget $env:RELEASE_TAG" --generate-notes
