name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/PowerModeWidget/PowerModeWidget.csproj -c Release
      - name: Offline tests
        run: dotnet run --project tests/PowerModeWidget.Tests/PowerModeWidget.Tests.csproj -c Release
      - name: Publish self-contained application
        run: dotnet publish src/PowerModeWidget/PowerModeWidget.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE -Destination artifacts/publish
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/PowerModeWidget-win-x64.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PowerModeWidget-win-x64
          path: artifacts/PowerModeWidget-win-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG artifacts/PowerModeWidget-win-x64.zip --verify-tag --title "PowerModeWidget $env:RELEASE_TAG" --generate-notes
